<body>
<div id="app">
	<div class="announce">Same-day delivery &nbsp;·&nbsp; Personalised gifts &nbsp;·&nbsp; Premium packaging</div>

		<a class="iconbtn" href="#/cart" aria-label="Cart">
			<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1 12h-11l-1-12Z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>

	<main id="view"><div id="boot" class="boot"><img class="boot-logo" src="assets/bless-emblem.png" alt=""><p>Loading…</p></div></main>
	<nav id="tabs" aria-label="Main">
		<a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4v-9Z"/></svg><span>Home</span></a>

		<a href="#/orders" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg><span>Orders</span></a>
	</nav>
	<div id="toast" role="status" aria-live="polite"></div>
